<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-containter">
      <div class="calculator-parts">
        <div class="calculator-display">
          <p class="summery" id="summery"></p>
          <p class="operationValue" id="CurrentInputDisplay"></p>
        </div>
        <div class="calculator-buttons-grid">
          <button onclick="appendToDisplay(7)">7</button>
          <button onclick="appendToDisplay(8)">8</button>
          <button onclick="appendToDisplay(9)">9</button>
          <button onclick="multipliziern('*')">*</button>
          <button onclick="appendToDisplay(4)">4</button>
          <button onclick="appendToDisplay(5)">5</button>
          <button onclick="appendToDisplay(6)">6</button>
          <button onclick="subtrahieren('-')">-</button>
          <button onclick="appendToDisplay(1)">1</button>
          <button onclick="appendToDisplay(2)">2</button>
          <button onclick="appendToDisplay(3)">3</button>
          <button onclick="add()">+</button>
          <button id="remove" onclick="reset()">CE</button>
          <button onclick="appendToDisplay(0)">0</button>
          <button id="summeryBtn" onclick="sumary()">=</button>
          <button onclick="dividieren('/')">/</button>
        </div>
      </div>
      <div class="calculator-result" id="resultDiv"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
